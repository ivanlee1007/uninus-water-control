name: Native HA checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/native-water-inventory]

permissions:
  contents: read

jobs:
  native-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-browser.txt
      - run: python -m pip install -r requirements-test.txt -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - run: python tools/verify_native_dashboard.py
